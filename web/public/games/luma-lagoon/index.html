<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#161629">
<meta name="description" content="Raise an axolotl, explore four magical places, and collect lost treasures in Nico's World.">
<title>Luma Lagoon · Nico's World</title><link rel="stylesheet" href="./lagoon.css"><link rel="stylesheet" href="./adventure.css"><script type="module" src="./game.mjs"></script>
</head><body><main>
<nav><a href="/" id="world">‹ &nbsp; Nico’s World</a><div><button id="audio" aria-pressed="false">♪ <span>Sound off</span></button><button id="lang" lang="es-MX">Español</button></div></nav>
<header><span class="crest" aria-hidden="true">☾</span><div class="nameplate"><h1 id="title">Luma Lagoon</h1><p id="tagline">Your little axolotl by moonlight.</p></div><span id="wallet" hidden></span></header>
<nav id="harborNav" class="harborNav" aria-label="Luma Lagoon" hidden>
<button type="button" data-view="lagoon"><i aria-hidden="true">≈</i><b>Lagoon</b></button>
<button type="button" data-view="map"><i aria-hidden="true">✥</i><b>Expeditions</b></button>
<button type="button" data-view="journal"><i aria-hidden="true">✧</i><b>Treasures</b></button>
<button type="button" data-view="studio"><i aria-hidden="true">♧</i><b>Dress up</b></button>
</nav>
<section class="habitat" id="habitat" aria-label="Lagoon"><div class="night"></div>
<div class="waterLight" aria-hidden="true"></div><div class="sky-dust" aria-hidden="true"></div>
<div class="scene-top"><div class="sceneLegend"><b id="placeName">Moonwater Cove</b><span id="phase">Mystery egg</span></div><span class="chip" id="gameScore" hidden></span></div>
<div id="petPosition"><div class="ripple"></div><div id="petFloat"><canvas id="petArt" width="436" height="372" aria-hidden="true" hidden></canvas><canvas id="creature" width="436" height="372" role="img" aria-label="A speckled axolotl egg"></canvas></div><button type="button" id="petTouch" hidden aria-label="Pet Luma"></button><span id="effect" aria-hidden="true"></span></div>
<button id="bug" hidden aria-label="Catch the firefly"><i></i></button>
<p class="speech" id="say" aria-live="polite">Who’s inside?</p></section>
<section id="port" hidden></section><div id="saveWarning" role="alert" hidden></div>
<section class="nursery panel" id="nursery"><div><h2 id="chooseTitle">Hatch a friend</h2><p id="chooseHint">Pick an egg and give your axolotl a name.</p><div id="eggs" role="group" aria-label="Egg color"></div></div><form id="hatchForm"><label for="petName" id="nameLabel">Pet name</label><div class="nameRow"><input id="petName" maxlength="18" value="Luma" autocomplete="off"><button class="primary" id="hatch">Hatch egg</button></div></form></section>
<section id="postcards"><h2 id="postcardsTitle">Waiting beyond the lagoon</h2><div id="postcardRow">
<div style="background-image:url(lilies.webp)"><b>Lily Run</b></div><div style="background-image:url(grotto.webp)"><b>Echo Grotto</b></div>
<div style="background-image:url(cenote.webp)"><b>Sunken Cenote</b></div><div style="background-image:url(summit.webp)"><b>Starfall Summit</b></div></div></section>
<div id="home" hidden><div id="wish"><span aria-hidden="true">✧</span><div><b id="wishTitle"></b><p id="wishText"></p></div><strong>◈ +2</strong></div><div class="careGrid"><section class="panel"><h2 id="careTitle">Care for Luma</h2><div class="actions" id="actions"></div><button id="quitPlay" class="smallButton" hidden>Finish later</button></section><section class="panel"><div class="panelHead"><h2 id="needsTitle">Pet needs</h2></div><div id="meters"></div></section></div><section class="growth panel"><div class="panelHead"><h2 id="bondTitle">Growing together</h2><span id="bondCount"></span></div><div class="bondBar"><i id="bondFill"></i></div><p id="bondHint"></p></section></div>
</main><dialog id="tripDialog"></dialog></body></html>
