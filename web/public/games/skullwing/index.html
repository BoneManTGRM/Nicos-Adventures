<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111224">
<meta name="description" content="Become Skullwing, a giant winged blue gorilla. Glide over rooftops, smash traffic and tear down three cities in Nico’s World.">
<title>Skullwing · Nico’s World</title>
<link rel="stylesheet" href="./skullwing.css"><script type="module" src="./game.mjs"></script>
</head>
<body>
<main id="app" data-view="menu">
 <header class="bar">
   <a class="home" href="/"><i class="brand-mark" aria-hidden="true"><b></b></i><span>Nico’s World</span></a>
   <span class="bar-divider" aria-hidden="true"></span><span class="game-brand">SKULLWING</span>
   <div class="utilities"><button id="lang" type="button">ES</button><button id="audio" type="button" aria-label="Sound" aria-pressed="true"><span class="soundwave" aria-hidden="true"><i></i><i></i><i></i><i></i></span></button></div>
 </header>
 <div id="menu">
  <section class="cover">
   <div class="cover-art"></div><div class="cover-ink"></div>
   <div class="hero-copy"><h1 aria-label="Skullwing"><span>SKULL</span><strong>WING</strong></h1>
   <p id="pitch">Take flight. Bring down the skyline.</p>
   <button id="start" class="main-button"><i class="play-mark" aria-hidden="true"></i><span id="startText">Smash the city</span></button></div>
  </section>
  <section class="selection" aria-labelledby="choose"><div class="section-head"><h2 id="choose">Choose your city</h2><span id="districtCount">3 districts</span></div><div id="cards" class="cards"></div></section>
 </div>
 <section id="arena" aria-label="Skullwing game" hidden>
  <header class="game-hud"><div><small id="districtLabel">DISTRICT</small><strong id="districtName"></strong></div><div class="score-wrap"><small id="scoreLabel">SCORE</small><strong id="score">0</strong></div><button id="pause" aria-label="Pause"><i class="pause-mark" aria-hidden="true"></i></button></header>
  <div id="stage"><canvas id="world" aria-label="City destruction playfield"></canvas><div id="mapHud"><div id="minimap" aria-hidden="true"></div><span id="clearCount"></span><span id="wreckCount" hidden></span></div><div id="combo" hidden></div><div id="callout" aria-live="polite"></div>
  <div id="hint"></div></div>
  <div id="controls"><div class="pad move-pad"><button data-action="left" aria-label="Move left"><span class="chev left"></span></button><button data-action="right" aria-label="Move right"><span class="chev"></span></button></div>
   <div class="pad ability-pad"><button data-action="jump"><i class="symbol wing-icon" aria-hidden="true">⌁</i><span id="jumpName">Flap</span></button><button data-action="attack"><i class="symbol claw-icon" aria-hidden="true">Ⅲ</i><span id="smashName">Smash</span></button><button data-action="roar"><i class="symbol roar-icon" aria-hidden="true">◎</i><span id="roarName">Roar</span><b id="chargeBar"></b></button></div>
  </div>
 </section>
 <div id="veil" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="dialog-band"></div><small id="dialogDistrict"></small><h2 id="dialogTitle"></h2><p id="dialogText"></p><div id="results" hidden></div><div id="dialogActions"></div></section></div>
</main>
</body></html>
