<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canonical Nico 3D Review</title>
    <style>
      html, body, #root { width: 100%; height: 100%; margin: 0; background: #061022; color: white; font-family: system-ui, sans-serif; }
      #root { display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      .preview { width: min(960px, 100%); }
      .preview h1 { margin: 0 0 14px; }
      .game-canvas { height: min(760px, calc(100vh - 120px)); }
      .game-canvas__viewport, .game-canvas__viewport canvas { height: 100%; }
      button { padding: 10px 13px; margin: 2px; border-radius: 10px; border: 1px solid #67e8f9; background: #15356c; color: white; font: inherit; font-weight: 800; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/game3d/nico/preview.tsx"></script>
  </body>
</html>
