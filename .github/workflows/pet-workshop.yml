name: Pet Workshop Play & Save Safety
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pet-workshop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pet-workshop:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Pet model and rendered UI regressions
        run: npx vitest run src/world/petPlay.test.ts src/world/PetWorkshop.test.tsx
      - name: Redirected offline navigation regressions
        run: node --test tests/service-worker-navigation.mjs
      - name: Build and existing release contracts
        run: npm run build
      - name: Pinned browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: English and Mexican Spanish desktop, mobile and iPhone preview journeys
        if: github.event_name == 'pull_request'
        run: npx playwright test --config playwright.pets.config.ts
      - name: Bind exact main production revision
        if: github.event_name == 'push'
        run: node scripts/wait-for-cutout-release.mjs
      - name: Live production pet journeys
        if: github.event_name == 'push'
        env:
          NICO_PRODUCTION_URL: https://nicos-world.com
        run: npx playwright test --config playwright.pets.config.ts
      - name: Preserve visual evidence and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pet-workshop-${{ github.sha }}
          retention-days: 14
          path: |
            web/pet-report
            web/pet-test-results
            web/pet-results.json
            web/cutout-production-release.json
            web/dist/release.json
