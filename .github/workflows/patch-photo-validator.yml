name: Patch Nico photo validator

on:
  push:
    branches:
      - feature/photo-nico-dressup-base
    paths:
      - .github/workflows/patch-photo-validator.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/photo-nico-dressup-base
          fetch-depth: 0
      - name: Update compatibility validator
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('web/scripts/validate-local-media-art.mjs')
          text = path.read_text()
          old = 'nico-photo-body.webp.b64'
          if old not in text:
              raise SystemExit('Legacy photo path was not found in local-media validator')
          text = text.replace(old, 'nico-photo-body.part1.b64')
          path.write_text(text)
          PY
          node web/scripts/validate-nico-photo-asset.mjs
          git rm .github/workflows/patch-photo-validator.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/scripts/validate-local-media-art.mjs
          git commit -m "Update local media validator for chunked Nico photo"
          git push origin HEAD:feature/photo-nico-dressup-base
