name: Robot Route Acceptance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: robot-route-${{ github.ref }}
  cancel-in-progress: true
jobs:
  robot-route:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Production build and unchanged budgets
        run: npm run build
      - name: Install desktop and phone browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Screenshot route recovery and full robot progression
        if: github.event_name == 'pull_request'
        run: npx playwright test --config playwright.robot-route.config.ts
      - name: Bind to exact Cloudflare release
        if: github.event_name == 'push'
        run: node scripts/wait-for-cutout-release.mjs
      - name: Verify the published robot route
        if: github.event_name == 'push'
        env:
          NICO_PRODUCTION_URL: https://nicos-world.com
        run: npx playwright test --config playwright.robot-route.config.ts
      - name: Preserve route verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-route-${{ github.sha }}
          retention-days: 7
          path: |
            web/robot-route-report
            web/robot-route-results
            web/robot-route-results.json
            web/cutout-production-release.json
