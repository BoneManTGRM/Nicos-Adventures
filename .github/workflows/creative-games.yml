name: Creative Games Acceptance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: creative-games-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualification:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: All existing and new unit tests
        run: npm test
      - name: Build and preserve performance budgets
        run: npm run build
      - name: Install desktop and phone browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Real controls, rewards, saves, crashes and mobile layout
        run: npx playwright test --config playwright.creative-games.config.ts --shard=${{ matrix.shard }}/4 --workers=2 --grep-invert "normal starter plays all three sections"
      - name: Preserve acceptance evidence and exact public build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creative-games-${{ github.sha }}-shard-${{ matrix.shard }}
          retention-days: 7
          path: |
            web/creative-games-report
            web/creative-games-test-results
            web/creative-games-results.json
            web/dist
  full-course:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: All existing and new unit tests
        run: npm test
      - name: Build and preserve performance budgets
        run: npm run build
      - name: Install desktop and phone browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Real controls, rewards, saves, crashes and mobile layout
        run: npx playwright test --config playwright.creative-games.config.ts creative-games-turbo-course.e2e.ts --grep "normal starter plays all three sections" --workers=1
      - name: Preserve acceptance evidence and exact public build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: truck-full-course-${{ github.sha }}
          retention-days: 7
          path: |
            web/creative-games-report
            web/creative-games-test-results
            web/creative-games-results.json
            web/dist
  stress:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium-mobile-en, webkit-iphone-en]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - name: Ten real minutes per browser engine
        run: npx playwright test --config playwright.truck-stress.config.ts --project=${{ matrix.browser }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: truck-stress-${{ github.sha }}-${{ matrix.browser }}
          retention-days: 7
          path: |
            web/truck-stress-results
            web/truck-stress.json
            web/truck-performance-results
  performance:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium-mobile-en, webkit-iphone-en]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - name: Isolate raster and composition costs on the actual route
        run: npx playwright test --config playwright.truck-performance.config.ts --project=${{ matrix.browser }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: truck-render-control-${{ github.sha }}-${{ matrix.browser }}
          retention-days: 7
          path: web/truck-performance-results
  games:
    needs: [qualification, stress, full-course, performance]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every qualification shard
        env:
          QUALIFICATION_RESULT: ${{ needs.qualification.result }}
          STRESS_RESULT: ${{ needs.stress.result }}
          COURSE_RESULT: ${{ needs.full-course.result }}
          PERFORMANCE_RESULT: ${{ needs.performance.result }}
        run: |
          test "$QUALIFICATION_RESULT" = success
          test "$STRESS_RESULT" = success
          test "$COURSE_RESULT" = success
          test "$PERFORMANCE_RESULT" = success
