name: Learning Lab preview qualification
on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/learning-lab.yml'
permissions:
  contents: read
jobs:
  learning-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --config playwright.learning.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: learning-lab-preview-evidence
          path: |
            web/playwright-report
            web/test-results
            web/dist/release.json
          retention-days: 7
