name: Toy Store Verification

on:
  pull_request:
    paths:
      - 'web/**'
      - 'docs/*STORE*'
      - 'docs/plans/*toy-store*'
      - '.github/workflows/toy-store.yml'
  push:
    branches: [main, feat/nicos-toy-store]
    paths:
      - 'web/**'
      - 'docs/*STORE*'
      - '.github/workflows/toy-store.yml'

permissions:
  contents: read

concurrency:
  group: toy-store-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  store:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Preserve reproducible source for review
        run: git -C .. archive --format=tar.gz --output="$PWD/../store-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: store-review-source-${{ github.sha }}
          path: store-source.tar.gz
          retention-days: 3
      - name: Unit baseline and regression tests
        run: npm test
      - name: Build and release validations
        run: npm run build
      - name: Verify store is absent from published output
        run: |
          test ! -e dist/store-catalog.json
          test ! -d dist/store-images
          test "$(find dist/assets -name 'StorePage-*' | wc -l)" -eq 0
          ! grep -q 'fw-store-link' dist/assets/*.js

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Verify generated shared catalogs
        run: |
          if [ -f shared/catalogs/manifest.json ]; then
            python scripts/generate_shared_catalog_views.py --check
          else
            echo "Shared catalog bootstrap has not committed its outputs yet."
          fi
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Compile
        run: python -m compileall -q app.py api core activities ui scripts


  cloudflare-root-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Install root build shim
        run: npm ci --no-audit --no-fund
      - name: Build from repository root
        run: npm run build
      - name: Verify both output paths
        run: test -f dist/index.html && test -f web/dist/index.html
      - name: Validate Wrangler static deployment package
        run: npx --yes wrangler@4.114.0 deploy --dry-run --outdir .wrangler-dry-run

  production-store:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Wait for production revision
        run: node scripts/wait-for-cutout-release.mjs
      - name: Verify former store route returns to the game
        run: |
          node --input-type=module -e 'const r=await fetch("https://nicos-world.com/store",{redirect:"manual"});if(![301,302,307,308].includes(r.status)||new URL(r.headers.get("location"),r.url).pathname!=="/")throw Error(`Store route still available: ${r.status} ${r.headers.get("location")}`);'
