name: Toy Store Verification

on:
  pull_request:
    paths:
      - 'web/**'
      - 'docs/*STORE*'
      - 'docs/plans/*toy-store*'
      - '.github/workflows/toy-store.yml'
  push:
    branches: [main, feat/nicos-toy-store]
    paths:
      - 'web/**'
      - 'docs/*STORE*'
      - '.github/workflows/toy-store.yml'

permissions:
  contents: read

concurrency:
  group: toy-store-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  store:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Preserve reproducible source for review
        run: git -C .. archive --format=tar.gz --output="$PWD/../store-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: store-review-source-${{ github.sha }}
          path: store-source.tar.gz
          retention-days: 3
      - name: Unit baseline and regression tests
        run: npm test
      - name: Build and release validations
        run: npm run build
      - name: Verify public store output
        run: node scripts/validate-store-output.mjs
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Browser store contract
        run: npx playwright test --config playwright.store.config.ts
      - name: Preserve immediate store evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-browser-evidence-${{ github.sha }}
          path: |
            web/store-test-results
            web/store-playwright-report
            web/dist/release.json
          retention-days: 14
      - name: Existing game browser regressions
        if: ${{ !cancelled() }}
        run: npx playwright test --config playwright.config.ts golden-adventure.e2e.ts whole-site-playtest.e2e.ts
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toy-store-evidence-${{ github.sha }}
          path: |
            web/store-test-results
            web/store-playwright-report
            web/dist/release.json
            web/test-results
            web/playwright-report
          retention-days: 14

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Verify generated shared catalogs
        run: |
          if [ -f shared/catalogs/manifest.json ]; then
            python scripts/generate_shared_catalog_views.py --check
          else
            echo "Shared catalog bootstrap has not committed its outputs yet."
          fi
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Compile
        run: python -m compileall -q app.py api core activities ui scripts


  cloudflare-root-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Install root build shim
        run: npm ci --no-audit --no-fund
      - name: Build from repository root
        run: npm run build
      - name: Verify both output paths
        run: test -f dist/index.html && test -f web/dist/index.html
      - name: Validate Wrangler static deployment package
        run: npx --yes wrangler@4.114.0 deploy --dry-run --outdir .wrangler-dry-run

  production-store:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Build exact comparison artifacts
        run: npm run build
      - name: Install production verification browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Verify live store revision, artifacts and six browser-language combinations
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/verify-store-production.mjs
      - name: Preserve production store evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-production-${{ github.sha }}
          path: web/store-production-proof
          if-no-files-found: error
          retention-days: 14
