name: Creative Games Production Verification
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: creative-games-production
  cancel-in-progress: true
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify exact live release and both games with real controls
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/verify-creative-production.mjs
      - name: Save production screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creative-games-production-${{ github.sha }}
          path: web/creative-production-proof
          retention-days: 14
          if-no-files-found: warn
