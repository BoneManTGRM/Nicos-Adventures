name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Verify generated shared catalogs
        run: |
          if [ -f shared/catalogs/manifest.json ]; then
            python scripts/generate_shared_catalog_views.py --check
          else
            echo "Shared catalog bootstrap has not committed its outputs yet."
          fi
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Compile
        run: python -m compileall -q app.py api core activities ui scripts

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install from lockfile
        run: npm ci --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Typecheck and build
        run: npm run build

  cloudflare-root-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Install root build shim
        run: npm ci --no-audit --no-fund
      - name: Build from repository root
        run: npm run build
      - name: Verify both output paths
        run: test -f dist/index.html && test -f web/dist/index.html
      - name: Validate Wrangler static deployment package
        run: npx --yes wrangler@4.114.0 deploy --dry-run --outdir .wrangler-dry-run
