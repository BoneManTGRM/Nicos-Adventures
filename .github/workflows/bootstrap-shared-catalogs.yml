name: Bootstrap shared catalogs

on:
  push:
    branches:
      - phase3/shared-catalogs-schema
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[shared catalogs generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase3/shared-catalogs-schema
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate canonical catalogs and client views
        run: |
          python scripts/bootstrap_shared_catalogs.py
          python scripts/generate_shared_catalog_views.py --check
      - name: Commit generated catalogs
        run: |
          if [ -z "$(git status --porcelain -- shared/catalogs core/generated_shared_catalogs.py web/src/generated/sharedCatalogs.ts)" ]; then
            echo "Shared catalogs are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/catalogs core/generated_shared_catalogs.py web/src/generated/sharedCatalogs.ts
          git commit -m "Bootstrap canonical shared catalogs [shared catalogs generated]"
          git push origin HEAD:phase3/shared-catalogs-schema
