name: Truck Returning Client Observation
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: truck-returning-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  returning-client:
    if: github.event.pull_request.number == 159 && github.event.pull_request.head.ref == 'mission/turbo-smash-truck'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - name: Preserve existing normal cached clients across the qualified release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/observe-truck-returning.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: truck-returning-${{ github.event.pull_request.head.sha }}
          retention-days: 14
          path: web/truck-returning-proof
