[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nicos-adventures"
version = "0.2.0"
description = "Nico's World: a kid-friendly robot adventure platform with Streamlit and web clients."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "streamlit>=1.41,<2",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"activities/animals.py" = ["F401"]
"core/animal_world.py" = ["UP035"]
"core/mecha_pack.py" = ["B010"]

[tool.setuptools.packages.find]
include = ["activities*", "api*", "core*", "ui*"]
exclude = ["tests*"]
