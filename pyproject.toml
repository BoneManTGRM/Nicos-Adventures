[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nicos-adventures"
version = "0.1.0"
description = "A kid-friendly Streamlit world with a buildable robot sidekick."
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.41,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"activities/animals.py" = ["F401"]
"core/animal_world.py" = ["UP035"]

[tool.setuptools.packages.find]
include = ["activities*", "core*", "ui*"]
exclude = ["tests*"]
